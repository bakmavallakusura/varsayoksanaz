<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sudenaz 3D Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
    }
    body {
      height: 100vh;
      background: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      perspective: 1000px;
      user-select: none;
    }
    .scene {
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }
    .heart-3d {
      position: relative;
      transform-style: preserve-3d;
      cursor: grab;
      will-change: transform; /* Mobil GPU ivmelendirmesi */
    }
    .ui_love_word {
      position: absolute;
      color: #a020f0;
      font-size: 0.95rem;
      font-weight: bold;
      font-family: sans-serif;
      /* Hafifletilmiş performans dostu parlama */
      text-shadow: 0 0 5px #a020f0;
      white-space: nowrap;
      transform-style: preserve-3d;
      backface-visibility: hidden; /* Arkadaki gereksiz yüzeyleri çizmeyerek hızlandırır */
      will-change: transform;
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="heart-3d" id="heart"></div>
  </div>

  <script>
    const container = document.getElementById('heart');
    
    // Mobil performans için katman ve yazı sayıları optimize edildi
    const layers = 12; 
    const textPerLayer = 20;

    for (let l = 0; l < layers; l++) {
      const phi = (l / layers) * Math.PI; 
      
      for (let i = 0; i < textPerLayer; i++) {
        const theta = (i / textPerLayer) * Math.PI * 2;

        const scale = 11; 
        const sinPhi = Math.sin(phi);
        const cosPhi = Math.cos(phi);

        const x = scale * 16 * Math.pow(Math.sin(theta), 3) * sinPhi;
        const y = -scale * (13 * Math.cos(theta) - 5 * Math.cos(2 * theta) - 2 * Math.cos(3 * theta) - Math.cos(4 * theta)) * (0.8 + 0.2 * sinPhi);
        const z = scale * 8 * Math.cos(theta) * sinPhi + scale * 2 * cosPhi;

        const span = document.createElement('span');
        span.className = 'ui_love_word';
        
        if (Math.random() < 0.4) {
          span.innerText = 'sudenaz';
        } else {
          span.innerText = 'I love you';
        }
        
        span.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(${theta}rad)`;
        container.appendChild(span);
      }
    }

    // Dokunarak / Sürükleyerek Döndürme
    let isDragging = false;
    let previousX = 0;
    let previousY = 0;
    let rotX = 15;
    let rotY = 10;

    function updateTransform() {
      container.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }

    updateTransform();

    function startDrag(e) {
      isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      previousX = clientX;
      previousY = clientY;
    }

    function moveDrag(e) {
      if (!isDragging) return;
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const deltaX = clientX - previousX;
      const deltaY = clientY - previousY;

      rotY += deltaX * 0.4;
      rotX -= deltaY * 0.4;

      rotX = Math.max(-60, Math.min(60, rotX));

      // Performans için requestAnimationFrame kullanımı
      requestAnimationFrame(updateTransform);

      previousX = clientX;
      previousY = clientY;
    }

    function stopDrag() {
      isDragging = false;
    }

    window.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', stopDrag);

    window.addEventListener('touchstart', startDrag, { passive: true });
    window.addEventListener('touchmove', moveDrag, { passive: true });
    window.addEventListener('touchend', stopDrag);
  </script>
</body>
</html>
