<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none; /* Dokunmatik kaydırmaları engeller */
    }
    body {
      height: 100vh;
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      perspective: 1000px;
      user-select: none;
    }
    .heart-3d {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      cursor: grab;
    }
    .heart-3d:active {
      cursor: grabbing;
    }
    .ui_love_word {
      position: absolute;
      color: #a020f0;
      font-size: 1rem;
      font-weight: bold;
      font-family: Arial, sans-serif;
      text-shadow: 0 0 10px #a020f0, 0 0 20px #a020f0, 0 0 30px #d8b4fe;
      white-space: nowrap;
      transform-style: preserve-3d;
      backface-visibility: visible;
    }
  </style>
</head>
<body>

  <div class="heart-3d" id="heart"></div>

  <script>
    const container = document.getElementById('heart');
    const layers = 16;
    const textPerLayer = 28;

    // 3D Kalp Noktalarını Oluşturma
    for (let l = 0; l < layers; l++) {
      const phi = (l / layers) * Math.PI;
      
      for (let i = 0; i < textPerLayer; i++) {
        const theta = (i / textPerLayer) * Math.PI * 2;

        const scale = 12;
        const x = scale * 16 * Math.pow(Math.sin(theta), 3) * Math.sin(phi);
        const y = -scale * (13 * Math.cos(theta) - 5 * Math.cos(2 * theta) - 2 * Math.cos(3 * theta) - Math.cos(4 * theta));
        const z = scale * 8 * Math.cos(phi) * Math.sin(theta);

        const span = document.createElement('span');
        span.className = 'ui_love_word';
        
        // %40 sudenaz, %60 I love you
        if (Math.random() < 0.4) {
          span.innerText = 'sudenaz';
        } else {
          span.innerText = 'I love you';
        }
        
        span.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(${theta}rad)`;

        container.appendChild(span);
      }
    }

    // Dokunarak / Sürükleyerek Döndürme Mantığı
    let isDragging = false;
    let previousX = 0;
    let previousY = 0;
    let rotX = 10;
    let rotY = 0;

    function updateTransform() {
      container.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }

    updateTransform();

    function startDrag(e) {
      isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      previousX = clientX;
      previousY = clientY;
    }

    function moveDrag(e) {
      if (!isDragging) return;
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const deltaX = clientX - previousX;
      const deltaY = clientY - previousY;

      rotY += deltaX * 0.5;
      rotX -= deltaY * 0.5;

      updateTransform();

      previousX = clientX;
      previousY = clientY;
    }

    function stopDrag() {
      isDragging = false;
    }

    // Fare Olayları
    window.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', stopDrag);

    // Dokunmatik (Mobil) Olayları
    window.addEventListener('touchstart', startDrag, { passive: false });
    window.addEventListener('touchmove', moveDrag, { passive: false });
    window.addEventListener('touchend', stopDrag);
  </script>
</body>
</html>
