<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sudenaz Perfect Heart</title>
  <style>
    body { margin: 0; background: #05000a; overflow: hidden; touch-action: none; }
    canvas { display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 25;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // KALP GEOMETRİSİ (Daha pürüzsüz ve Solid)
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.bezierCurveTo(0, 1.5, 2, 2.5, 4, 2.5);
    shape.bezierCurveTo(6, 2.5, 6, 0.5, 6, 0.5);
    shape.bezierCurveTo(6, -1.5, 3, -3, 0, -5);
    shape.bezierCurveTo(-3, -3, -6, -1.5, -6, 0.5);
    shape.bezierCurveTo(-6, 0.5, -6, 2.5, -4, 2.5);
    shape.bezierCurveTo(-2, 2.5, 0, 1.5, 0, 0);

    const geometry = new THREE.ShapeGeometry(shape, 64);
    const material = new THREE.MeshBasicMaterial({ 
        color: 0xff0055, 
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.95 
    });
    
    const heart = new THREE.Group();
    const front = new THREE.Mesh(geometry, material);
    const back = new THREE.Mesh(geometry, material);
    back.rotation.y = Math.PI;
    heart.add(front, back);
    scene.add(heart);

    // YAZILAR
    function createTextTexture(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512; canvas.height = 128;
      ctx.font = 'Bold 90px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, 256, 64);
      return new THREE.CanvasTexture(canvas);
    }

    const messages = ['seni', 'çok', 'seviyorum', 'hayatım'];
    const cards = messages.map((msg, i) => {
      const tex = createTextTexture(msg);
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(10, 2.5), new THREE.MeshBasicMaterial({map: tex, transparent: true, opacity: 0}));
      scene.add(mesh);
      return { mesh, angle: (i / 4) * Math.PI * 2 };
    });

    let rotY = 0;
    function animate() {
      requestAnimationFrame(animate);
      rotY -= 0.015; // Genel hız
      
      // Kalp kendi ekseninde daha hızlı dönsün
      heart.rotation.y = rotY * 1.5; 
      
      cards.forEach(c => {
        // Yazılar orbit yapsın
        c.mesh.position.set(Math.sin(-c.angle - rotY) * 12, 0, Math.cos(-c.angle - rotY) * 12);
        c.mesh.lookAt(camera.position);
        
        // Sadece karşıya geldiğinde görünsün
        c.mesh.material.opacity = Math.cos(rotY + c.angle) > 0.7 ? 1 : 0;
      });
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
