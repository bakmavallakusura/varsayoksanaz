<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sudenaz 3D Interactive Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      background-color: #030106;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    .hint {
      position: absolute;
      bottom: 20px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.8rem;
      pointer-events: none;
      text-align: center;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="hint">Kalbi çevirerek mesajı oku...</div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 28;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // TEXTURE OLUŞTURUCU
    function createTextTexture(text, colorStr, glowColor, fontSize = 36, addBg = false) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;

      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (addBg) {
        ctx.fillStyle = 'rgba(12, 3, 24, 0.85)';
        ctx.strokeStyle = '#ff00aa';
        ctx.lineWidth = 4;
        // Yuvarlatılmış Kutu
        ctx.beginPath();
        ctx.roundRect(20, 10, canvas.width - 40, canvas.height - 20, 16);
        ctx.fill();
        ctx.stroke();
      }

      ctx.font = `Bold ${fontSize}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      if (glowColor) {
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 20;
      }
      
      ctx.fillStyle = colorStr;
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      return texture;
    }

    // KALP ARKA PLAN DOKULARI
    const texOuterSudenaz = createTextTexture('sudenaz', '#f066ff', '#e000ff', 34);
    const texOuterILoveYou = createTextTexture('I love you', '#ff33aa', '#ff0077', 34);

    const texInnerSudenaz = createTextTexture('sudenaz', '#3a0ca3', null, 26);
    const texInnerILoveYou = createTextTexture('I love you', '#240046', null, 26);

    // 4 ANA YÖN KELİMELERİ (Kutulu ve Çok Net)
    const texFront = createTextTexture('seni', '#ffffff', '#ff00aa', 64, true);
    const texRight = createTextTexture('çok', '#ffffff', '#ff00aa', 64, true);
    const texBack = createTextTexture('seviyorum', '#ffffff', '#ff00aa', 64, true);
    const texLeft = createTextTexture('hayatım', '#ffffff', '#ff00aa', 64, true);

    const heartGroup = new THREE.Group();
    scene.add(heartGroup);

    // KALP NOKTALARI
    const totalPoints = 360;
    const planeGeo = new THREE.PlaneGeometry(2.2, 0.55);

    for (let i = 0; i < totalPoints; i++) {
      const u = Math.PI * (2 * Math.random() - 1);
      const v = (Math.PI / 2) * (2 * Math.random() - 1);

      const x = 16 * Math.pow(Math.sin(u), 3) * Math.cos(v);
      const y = (13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u)) * Math.cos(v);
      const z = 6 * Math.sin(v);

      const distFromCenter = Math.sqrt(x*x + y*y + z*z);
      const isInner = distFromCenter < 7; 

      const isSudenaz = Math.random() < 0.4;
      let chosenTex = isInner ? (isSudenaz ? texInnerSudenaz : texInnerILoveYou) : (isSudenaz ? texOuterSudenaz : texOuterILoveYou);

      const mat = new THREE.MeshBasicMaterial({
        map: chosenTex,
        transparent: true,
        blending: isInner ? THREE.NormalBlending : THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide,
        opacity: isInner ? 0.4 : 0.95
      });

      const mesh = new THREE.Mesh(planeGeo, mat);
      const scale = 0.65;
      mesh.position.set(x * scale * 0.5, y * scale * 0.5, z * scale * 0.5);
      mesh.lookAt(mesh.position.clone().multiplyScalar(2));

      heartGroup.add(mesh);
    }

    // 4 YÖN KARTLARINI YERLEŞTİRME
    function createDirectionCard(texture, angleY) {
      const geo = new THREE.PlaneGeometry(11, 2.75);
      const mat = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        opacity: 0
      });
      const mesh = new THREE.Mesh(geo, mat);
      
      // Kalbin tam merkezine yerleştirip ilgili açıya döndürüyoruz
      mesh.rotation.y = angleY;
      heartGroup.add(mesh);
      return { mat, angleY };
    }

    // 4 Ana Açı (Radyan)
    const cardFront = createDirectionCard(texFront, 0);                 // Ön (0 rad)
    const cardRight = createDirectionCard(texRight, -Math.PI / 2);      // Sağ (-90 derece)
    const cardBack = createDirectionCard(texBack, Math.PI);             // Arka (180 derece)
    const cardLeft = createDirectionCard(texLeft, Math.PI / 2);          // Sol (90 derece)

    // DOKUNMATİK VE DÖNDÜRME
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    function onPointerDown(e) {
      isDragging = true;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      previousMousePosition = { x, y };
    }

    function onPointerMove(e) {
      if (!isDragging) return;

      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;

      const deltaX = x - previousMousePosition.x;
      const deltaY = y - previousMousePosition.y;

      heartGroup.rotation.y += deltaX * 0.008;
      // Dikey eksende çok fazla yatıp açı bozmasın diye hafif sınırlandırdık
      heartGroup.rotation.x = Math.max(-0.4, Math.min(0.4, heartGroup.rotation.x + deltaY * 0.005));

      previousMousePosition = { x, y };
    }

    function onPointerUp() {
      isDragging = false;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // RAHAT VE AKICI YAZI GÖRÜNÜRLÜK MATEMATİĞİ
    function updateCardOpacity(card) {
      // Y eksenindeki mevcut dönüşü 0 - 2PI arasında normalize et
      let currentY = heartGroup.rotation.y % (Math.PI * 2);
      if (currentY < 0) currentY += Math.PI * 2;

      let targetY = card.angleY % (Math.PI * 2);
      if (targetY < 0) targetY += Math.PI * 2;

      // Kamera açısına olan mesafe
      let diff = Math.abs(currentY - targetY);
      if (diff > Math.PI) diff = Math.PI * 2 - diff;

      // Geniş bir açıda görünür olsun (zorlamasın)
      const maxAngle = Math.PI / 3.5; 
      if (diff < maxAngle) {
        const factor = 1 - (diff / maxAngle);
        card.mat.opacity = Math.pow(factor, 2); // Yumuşak geçiş
      } else {
        card.mat.opacity = 0;
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      if (!isDragging) {
        heartGroup.rotation.y += 0.003; // Süzülme hızı
      }

      updateCardOpacity(cardFront);
      updateCardOpacity(cardRight);
      updateCardOpacity(cardBack);
      updateCardOpacity(cardLeft);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
