<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love You</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .heart-container {
      position: relative;
      width: 250px;
      height: 250px;
    }
    .ui_love_word {
      position: absolute;
      color: #ea0d0d;
      font-size: 1.1rem;
      font-weight: bold;
      text-shadow: 0 0 10px #fff;
      letter-spacing: 1px;
      white-space: nowrap;
      animation: float 2s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: scale(0.9) translateY(0); }
      100% { transform: scale(1.1) translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="heart-container" id="heart"></div>
  <script>
    const container = document.getElementById('heart');
    const totalText = 50;
    for (let i = 0; i < totalText; i++) {
      const angle = (i / totalText) * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(angle), 3);
      const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));

      const span = document.createElement('span');
      span.className = 'ui_love_word';
      span.innerText = 'I love you';
      
      span.style.left = `${125 + x * 6.5}px`;
      span.style.top = `${125 + y * 6.5}px`;
      span.style.animationDelay = `${(i % 10) * 0.2}s`;

      container.appendChild(span);
    }
  </script>
</body>
</html>
