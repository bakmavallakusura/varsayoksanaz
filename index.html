<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sudenaz Kar Efektli</title>
  <style>
    body { margin: 0; background-color: #05000a; overflow: hidden; touch-action: none; }
    canvas { display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 25;
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // KAR EFEKTİ (Partiküller)
    const starGeo = new THREE.BufferGeometry();
    const starCount = 2000;
    const posArr = new Float32Array(starCount * 3);
    for(let i=0; i<starCount*3; i++) posArr[i] = (Math.random() - 0.5) * 100;
    starGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    const starMat = new THREE.PointsMaterial({ size: 0.1, color: 0xffffff, transparent: true, opacity: 0.5 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    function createTextTexture(text, colorStr, fontSize = 42, addBg = false) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512; canvas.height = 128;
      ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0,0,512,128);
      if(addBg) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath(); ctx.roundRect(0,0,512,128, 20); ctx.fill();
      }
      ctx.font = `Bold ${fontSize}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = colorStr; ctx.fillText(text, 256, 64);
      return new THREE.CanvasTexture(canvas);
    }

    const texInner = createTextTexture('sudenaz', '#ff00ff', 36);
    const texOuter = createTextTexture('I love you', '#ffffff', 36);
    const heartGroup = new THREE.Group();
    scene.add(heartGroup);

    // DAHA DOLU KALP (1500 nokta)
    for (let i = 0; i < 1500; i++) {
      const u = Math.PI * (2 * Math.random() - 1);
      const v = (Math.PI / 2) * (2 * Math.random() - 1);
      const x = 16 * Math.pow(Math.sin(u), 3) * Math.cos(v);
      const y = (13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u)) * Math.cos(v);
      const z = 6 * Math.sin(v);
      
      const mat = new THREE.MeshBasicMaterial({ 
        map: Math.random() > 0.5 ? texInner : texOuter, 
        transparent: true, opacity: 0.8, side: THREE.FrontSide 
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.4), mat);
      mesh.position.set(x*0.3, y*0.3, z*0.3);
      mesh.lookAt(0,0,0);
      heartGroup.add(mesh);
    }

    // ANA MESAJ KARTLARI
    const messages = ['seni', 'çok', 'seviyorum', 'hayatım'];
    const cards = messages.map((msg, i) => {
      const tex = createTextTexture(msg, '#ffffff', 120, true);
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(10, 3), new THREE.MeshBasicMaterial({map: tex, transparent: true}));
      scene.add(mesh);
      return { mesh, angle: (i / 4) * Math.PI * 2 };
    });

    let rot = 0;
    function animate() {
      requestAnimationFrame(animate);
      rot += 0.005;
      heartGroup.rotation.y = rot;
      stars.rotation.y += 0.0005;
      
      cards.forEach((c, i) => {
        const targetAngle = rot + c.angle;
        c.mesh.position.set(Math.cos(targetAngle)*15, 0, Math.sin(targetAngle)*15);
        c.mesh.lookAt(camera.position);
        // Sadece öne geldiğinde görünür yap
        const visible = Math.cos(targetAngle) > 0.8;
        c.mesh.material.opacity = visible ? 1 : 0;
      });
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
