<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D I Love You Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      perspective: 1000px;
    }
    .heart-3d {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      animation: rotate3d 10s linear infinite;
    }
    .ui_love_word {
      position: absolute;
      color: #ff2a70;
      font-size: 1rem;
      font-weight: bold;
      font-family: Arial, sans-serif;
      text-shadow: 0 0 10px #ff2a70, 0 0 20px #ff2a70;
      white-space: nowrap;
      transform-style: preserve-3d;
      backface-visibility: visible;
    }

    @keyframes rotate3d {
      0% {
        transform: rotateX(10deg) rotateY(0deg) rotateZ(0deg);
      }
      100% {
        transform: rotateX(10deg) rotateY(360deg) rotateZ(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="heart-3d" id="heart"></div>

  <script>
    const container = document.getElementById('heart');
    const layers = 16;
    const textPerLayer = 28;

    for (let l = 0; l < layers; l++) {
      const phi = (l / layers) * Math.PI;
      
      for (let i = 0; i < textPerLayer; i++) {
        const theta = (i / textPerLayer) * Math.PI * 2;

        const scale = 12;
        const x = scale * 16 * Math.pow(Math.sin(theta), 3) * Math.sin(phi);
        const y = -scale * (13 * Math.cos(theta) - 5 * Math.cos(2 * theta) - 2 * Math.cos(3 * theta) - Math.cos(4 * theta));
        const z = scale * 8 * Math.cos(phi) * Math.sin(theta);

        const span = document.createElement('span');
        span.className = 'ui_love_word';
        span.innerText = 'I love you';
        
        span.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(${theta}rad)`;

        container.appendChild(span);
      }
    }
  </script>
</body>
</html>
