<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sudenaz High Contrast 3D Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      background-color: #030106;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    .hint {
      position: absolute;
      bottom: 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.8rem;
      pointer-events: none;
      text-align: center;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="hint">Farklı açılardan bakarak gizli kelimeleri bul...</div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 28;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // TEXTURE OLUŞTURUCU
    function createTextTexture(text, colorStr, glowColor, fontSize = 36, addBg = false) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;

      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (addBg) {
        ctx.fillStyle = 'rgba(5, 2, 12, 0.85)';
        ctx.fillRect(40, 20, canvas.width - 80, canvas.height - 40);
      }

      ctx.font = `Bold ${fontSize}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      if (glowColor) {
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 18;
      }
      
      ctx.fillStyle = colorStr;
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      return texture;
    }

    // RENK RENK TEXTURE'LAR
    // Dış Yüzey: Parlak Neon Mor
    const texOuterSudenaz = createTextTexture('sudenaz', '#f066ff', '#e000ff', 34);
    const texOuterILoveYou = createTextTexture('I love you', '#ff33aa', '#ff0077', 34);

    // İç Taraf: Derin Koyu Mor (Arka planı karartıp derinlik katar)
    const texInnerSudenaz = createTextTexture('sudenaz', '#5a189a', null, 30);
    const texInnerILoveYou = createTextTexture('I love you', '#3c096c', null, 30);

    // Gizli Açı Kelimeleri: Yüksek Kontrastlı Parlak Beyaz / Pembe (Arka planlı)
    const texTop = createTextTexture('seni', '#ffffff', '#ff00aa', 56, true);
    const texRight = createTextTexture('çok', '#ffffff', '#ff00aa', 56, true);
    const texLeft = createTextTexture('seviyorum', '#ffffff', '#ff00aa', 56, true);
    const texBottom = createTextTexture('hayatım', '#ffffff', '#ff00aa', 56, true);

    const heartGroup = new THREE.Group();
    scene.add(heartGroup);

    const totalPoints = 400;
    const planeGeo = new THREE.PlaneGeometry(2.2, 0.55);

    for (let i = 0; i < totalPoints; i++) {
      const u = Math.PI * (2 * Math.random() - 1);
      const v = (Math.PI / 2) * (2 * Math.random() - 1);

      const x = 16 * Math.pow(Math.sin(u), 3) * Math.cos(v);
      const y = (13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u)) * Math.cos(v);
      const z = 6 * Math.sin(v);

      // İç-Dış ayrımı (Merkeze yakınlık kontrolü)
      const distFromCenter = Math.sqrt(x*x + y*y + z*z);
      const isInner = distFromCenter < 7; 

      const isSudenaz = Math.random() < 0.4;
      let chosenTex;

      if (isInner) {
        chosenTex = isSudenaz ? texInnerSudenaz : texInnerILoveYou;
      } else {
        chosenTex = isSudenaz ? texOuterSudenaz : texOuterILoveYou;
      }

      const mat = new THREE.MeshBasicMaterial({
        map: chosenTex,
        transparent: true,
        blending: isInner ? THREE.NormalBlending : THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide,
        opacity: isInner ? 0.6 : 1.0 // İçtekileri hafif saydam yapıp arka plana atıyoruz
      });

      const mesh = new THREE.Mesh(planeGeo, mat);
      const scale = 0.65;
      mesh.position.set(x * scale * 0.5, y * scale * 0.5, z * scale * 0.5);
      mesh.lookAt(mesh.position.clone().multiplyScalar(2));

      heartGroup.add(mesh);
    }

    // AÇI GİZLİ YAZILARI
    function createAngleText(texture, rx, ry, rz) {
      const geo = new THREE.PlaneGeometry(9, 2.25);
      const mat = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        opacity: 0
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.set(rx, ry, rz);
      heartGroup.add(mesh);
      return mat;
    }

    const matTop = createAngleText(texTop, Math.PI / 2, 0, 0);
    const matBottom = createAngleText(texBottom, -Math.PI / 2, 0, 0);
    const matRight = createAngleText(texRight, 0, Math.PI / 2, 0);
    const matLeft = createAngleText(texLeft, 0, -Math.PI / 2, 0);

    // KONTROLLER
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    function onPointerDown(e) {
      isDragging = true;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      previousMousePosition = { x, y };
    }

    function onPointerMove(e) {
      if (!isDragging) return;

      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;

      const deltaX = x - previousMousePosition.x;
      const deltaY = y - previousMousePosition.y;

      heartGroup.rotation.y += deltaX * 0.008;
      heartGroup.rotation.x += deltaY * 0.008;

      previousMousePosition = { x, y };
    }

    function onPointerUp() {
      isDragging = false;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ANİMASYON DÖNGÜSÜ
    function animate() {
      requestAnimationFrame(animate);

      if (!isDragging) {
        heartGroup.rotation.y += 0.0015;
      }

      // Açı Görünürlük Kontrolleri
      const topTarget = -Math.PI / 2;
      const topDiff = Math.abs(Math.sin(heartGroup.rotation.x - topTarget));
      matTop.opacity = Math.pow(1 - topDiff, 5);

      const botTarget = Math.PI / 2;
      const botDiff = Math.abs(Math.sin(heartGroup.rotation.x - botTarget));
      matBottom.opacity = Math.pow(1 - botDiff, 5);

      const rightTarget = -Math.PI / 2;
      const rightDiff = Math.abs(Math.sin(heartGroup.rotation.y - rightTarget));
      matRight.opacity = Math.pow(1 - rightDiff, 5);

      const leftTarget = Math.PI / 2;
      const leftDiff = Math.abs(Math.sin(heartGroup.rotation.y - leftTarget));
      matLeft.opacity = Math.pow(1 - leftDiff, 5);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
