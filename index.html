<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sudenaz Final Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body { width: 100vw; height: 100vh; background-color: #030106; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
    #canvas-container { width: 100%; height: 100%; }
    .hint { position: absolute; bottom: 20px; color: rgba(255, 255, 255, 0.6); font-size: 0.9rem; pointer-events: none; text-shadow: 0 0 5px #000; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="hint">Kalbi döndür, mesajı yakala...</div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 28;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Daha yüksek çözünürlüklü tekstürler
    function createTextTexture(text, colorStr, glowColor, fontSize = 42, addBg = false) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1024; canvas.height = 256; 
      ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      if (addBg) {
        ctx.fillStyle = 'rgba(15, 0, 30, 0.95)';
        ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.roundRect(40, 20, canvas.width - 80, canvas.height - 40, 30);
        ctx.fill(); ctx.stroke();
      }
      ctx.font = `Bold ${fontSize}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (glowColor) { ctx.shadowColor = glowColor; ctx.shadowBlur = 30; }
      ctx.fillStyle = colorStr; ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      return texture;
    }

    const texOuterSudenaz = createTextTexture('sudenaz', '#ff66ff', '#ff00ff', 48);
    const texOuterILoveYou = createTextTexture('I love you', '#ff33aa', '#ff0077', 48);
    const texInnerSudenaz = createTextTexture('sudenaz', '#5e17eb', null, 36);
    const texInnerILoveYou = createTextTexture('I love you', '#3c096c', null, 36);

    const texFront = createTextTexture('seni', '#ffffff', '#ff00ff', 90, true);
    const texRight = createTextTexture('çok', '#ffffff', '#ff00ff', 90, true);
    const texBack = createTextTexture('seviyorum', '#ffffff', '#ff00ff', 90, true);
    const texLeft = createTextTexture('hayatım', '#ffffff', '#ff00ff', 90, true);

    const heartGroup = new THREE.Group();
    scene.add(heartGroup);

    // Kalp noktalarını sıkılaştırdık
    const totalPoints = 500; 
    const planeGeo = new THREE.PlaneGeometry(2.4, 0.6);

    for (let i = 0; i < totalPoints; i++) {
      const u = Math.PI * (2 * Math.random() - 1);
      const v = (Math.PI / 2) * (2 * Math.random() - 1);
      const x = 16 * Math.pow(Math.sin(u), 3) * Math.cos(v);
      const y = (13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u)) * Math.cos(v);
      const z = 6 * Math.sin(v);
      const distFromCenter = Math.sqrt(x*x + y*y + z*z);
      const isInner = distFromCenter < 7; 
      const isSudenaz = Math.random() < 0.4;
      let chosenTex = isInner ? (isSudenaz ? texInnerSudenaz : texInnerILoveYou) : (isSudenaz ? texOuterSudenaz : texOuterILoveYou);
      const mat = new THREE.MeshBasicMaterial({ map: chosenTex, transparent: true, blending: isInner ? THREE.NormalBlending : THREE.AdditiveBlending, depthWrite: false, side: THREE.FrontSide, opacity: isInner ? 0.4 : 1.0 });
      const mesh = new THREE.Mesh(planeGeo, mat);
      mesh.position.set(x * 0.35, y * 0.35, z * 0.35);
      mesh.lookAt(mesh.position.clone().multiplyScalar(2));
      heartGroup.add(mesh);
    }

    const cardsGroup = new THREE.Group();
    scene.add(cardsGroup);

    function createDirectionCard(texture, angleY) {
      const geo = new THREE.PlaneGeometry(12, 3);
      const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false, side: THREE.FrontSide, opacity: 0 });
      const mesh = new THREE.Mesh(geo, mat);
      cardsGroup.add(mesh);
      return { mat, mesh, angleY };
    }

    const cardFront = createDirectionCard(texFront, 0);
    const cardRight = createDirectionCard(texRight, -Math.PI / 2);
    const cardBack = createDirectionCard(texBack, Math.PI);
    const cardLeft = createDirectionCard(texLeft, Math.PI / 2);

    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    function onPointerDown(e) { isDragging = true; const x = e.touches ? e.touches[0].clientX : e.clientX; const y = e.touches ? e.touches[0].clientY : e.clientY; previousMousePosition = { x, y }; }
    function onPointerMove(e) {
      if (!isDragging) return;
      const x = e.touches ? e.touches[0].clientX : e.clientX; const y = e.touches ? e.touches[0].clientY : e.clientY;
      const deltaX = x - previousMousePosition.x;
      const deltaY = y - previousMousePosition.y;
      heartGroup.rotation.y += deltaX * 0.008;
      heartGroup.rotation.x = Math.max(-0.4, Math.min(0.4, heartGroup.rotation.x + deltaY * 0.005));
      previousMousePosition = { x, y };
    }
    function onPointerUp() { isDragging = false; }
    window.addEventListener('mousedown', onPointerDown); window.addEventListener('mousemove', onPointerMove); window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchstart', onPointerDown, { passive: true }); window.addEventListener('touchmove', onPointerMove, { passive: true }); window.addEventListener('touchend', onPointerUp);

    function updateCard(card) {
      let currentY = heartGroup.rotation.y % (Math.PI * 2);
      if (currentY < 0) currentY += Math.PI * 2;
      let targetY = card.angleY % (Math.PI * 2);
      if (targetY < 0) targetY += Math.PI * 2;
      let diff = Math.abs(currentY - targetY);
      if (diff > Math.PI) diff = Math.PI * 2 - diff;

      // HASSAS AÇI: Tam açıda belirmesi için
      const maxAngle = Math.PI / 6; 
      if (diff < maxAngle) {
        card.mat.opacity = Math.pow(1 - (diff / maxAngle), 2);
      } else {
        card.mat.opacity = 0;
      }
      card.mesh.rotation.copy(camera.rotation);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!isDragging) { heartGroup.rotation.y += 0.002; }
      updateCard(cardFront); updateCard(cardRight); updateCard(cardBack); updateCard(cardLeft);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
