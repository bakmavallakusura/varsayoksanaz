<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sudenaz 3D Neon Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      background-color: #030106;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
  </style>
  <!-- 3D Render Engine (Three.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    // 1. SAHNE VE KAMERA KURULUMU
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 28;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 2. TEXTURE (YAZI GÖRSELLERİ) OLUŞTURUCU
    function createTextTexture(text, colorStr) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 256;
      canvas.height = 64;

      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = 'Bold 32px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      // Neon Parlama Efekti
      ctx.shadowColor = colorStr;
      ctx.shadowBlur = 12;
      ctx.fillStyle = colorStr;
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      return texture;
    }

    const texSudenaz = createTextTexture('sudenaz', '#c040ff');
    const texILoveYou = createTextTexture('I love you', '#a020f0');

    // 3. 3D KALP GEOMETRİSİ VE PARÇACIKLAR
    const heartGroup = new THREE.Group();
    scene.add(heartGroup);

    const totalPoints = 450; // İdeal yoğunluk
    const planeGeo = new THREE.PlaneGeometry(2.2, 0.55);

    for (let i = 0; i < totalPoints; i++) {
      // Düzgün 3D Kalp Dağılımı Denklemi
      const u = Math.PI * (2 * Math.random() - 1);
      const v = (Math.PI / 2) * (2 * Math.random() - 1);

      // Parametrik 3D Kalp Formülü
      const x = 16 * Math.pow(Math.sin(u), 3) * Math.cos(v);
      const y = (13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u)) * Math.cos(v);
      const z = 6 * Math.sin(v);

      // %40 sudenaz, %60 I love you seçimi
      const isSudenaz = Math.random() < 0.4;
      const mat = new THREE.MeshBasicMaterial({
        map: isSudenaz ? texSudenaz : texILoveYou,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(planeGeo, mat);
      
      // Ölçekleme ve Konumlandırma
      const scale = 0.65;
      mesh.position.set(x * scale * 0.5, y * scale * 0.5, z * scale * 0.5);
      
      // Yazıların kalbin dışına doğru bakması
      mesh.lookAt(mesh.position.clone().multiplyScalar(2));

      heartGroup.add(mesh);
    }

    // Başlangıç Açısı
    heartGroup.rotation.x = 0.2;

    // 4. DOKUNMATİK / FARE İLE DÖNDÜRME KONTROLÜ
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    function onPointerDown(e) {
      isDragging = true;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      previousMousePosition = { x, y };
    }

    function onPointerMove(e) {
      if (!isDragging) return;

      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;

      const deltaX = x - previousMousePosition.x;
      const deltaY = y - previousMousePosition.y;

      heartGroup.rotation.y += deltaX * 0.008;
      heartGroup.rotation.x += deltaY * 0.008;

      previousMousePosition = { x, y };
    }

    function onPointerUp() {
      isDragging = false;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    // Ekran Boyutu Değişimi
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 5. ANIMATION LOOP (AKICI RENDER)
    function animate() {
      requestAnimationFrame(animate);
      
      // Bırakıldığında çok hafif kendi etrafında süzülsün
      if (!isDragging) {
        heartGroup.rotation.y += 0.002;
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
