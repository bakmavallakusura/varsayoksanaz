<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sudenaz 3D Heart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body { width: 100vw; height: 100vh; background: radial-gradient(circle, #1a0526 0%, #030106 100%); overflow: hidden; display: flex; justify-content: center; align-items: center; }
    #canvas-container { width: 100%; height: 100%; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 28;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Kar Efekti
    const starGeo = new THREE.BufferGeometry();
    const starCount = 800;
    const posArr = new Float32Array(starCount * 3);
    for(let i=0; i<starCount*3; i++) posArr[i] = (Math.random() - 0.5) * 60;
    starGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    const starMat = new THREE.PointsMaterial({ size: 0.12, color: 0xffffff, transparent: true, opacity: 0.35 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    function createTextTexture(text, colorStr, glowColor, fontSize = 42) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1024; canvas.height = 256;
      ctx.font = `Bold ${fontSize}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (glowColor) { ctx.shadowColor = glowColor; ctx.shadowBlur = 20; }
      ctx.fillStyle = colorStr; ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      return new THREE.CanvasTexture(canvas);
    }

    const texSudenaz = createTextTexture('sudenaz', '#ff66ff', '#ff00ff', 50);
    const texLove = createTextTexture('I love you', '#ff33aa', '#ff0077', 50);
    
    const texFront = createTextTexture('seni', '#ffffff', '#ff00ff', 120);
    const texRight = createTextTexture('çok', '#ffffff', '#ff00ff', 120);
    const texBack = createTextTexture('seviyorum', '#ffffff', '#ff00ff', 120);
    const texLeft = createTextTexture('hayatım', '#ffffff', '#ff00ff', 120);

    const heartGroup = new THREE.Group();
    scene.add(heartGroup);

    // Dış Yüzey Kalp Noktaları (800 adet)
    for (let i = 0; i < 800; i++) {
      const u = Math.PI * (2 * Math.random() - 1);
      const v = (Math.PI / 2) * (2 * Math.random() - 1);
      const x = 16 * Math.pow(Math.sin(u), 3) * Math.cos(v);
      const y = (13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u)) * Math.cos(v);
      const z = 6 * Math.sin(v);
      const mat = new THREE.MeshBasicMaterial({ 
        map: Math.random() > 0.5 ? texSudenaz : texLove, 
        transparent: true, 
        opacity: 0.8, 
        side: THREE.FrontSide 
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.45), mat);
      mesh.position.set(x * 0.35, y * 0.35, z * 0.35);
      mesh.lookAt(mesh.position.clone().multiplyScalar(2));
      heartGroup.add(mesh);
    }

    // İÇİNİ DOLDURAN NOKTALAR (400 adet iç hacim yazısı)
    for (let i = 0; i < 400; i++) {
      const u = Math.PI * (2 * Math.random() - 1);
      const v = (Math.PI / 2) * (2 * Math.random() - 1);
      const x = 16 * Math.pow(Math.sin(u), 3) * Math.cos(v);
      const y = (13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u)) * Math.cos(v);
      const z = 6 * Math.sin(v);
      
      // Kalbin iç alanına rastgele ölçekle doldurma (0.1 ile 0.8 arası içe gömme)
      const internalScale = 0.1 + Math.random() * 0.7;
      
      const mat = new THREE.MeshBasicMaterial({ 
        map: Math.random() > 0.5 ? texSudenaz : texLove, 
        transparent: true, 
        opacity: 0.45, 
        side: THREE.FrontSide 
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.35), mat);
      mesh.position.set(x * 0.35 * internalScale, y * 0.35 * internalScale, z * 0.35 * internalScale);
      mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
      heartGroup.add(mesh);
    }

    // Ana Mesaj Kartları
    const cards = [
      { t: texFront, a: 0 }, { t: texRight, a: -Math.PI / 2 },
      { t: texBack, a: Math.PI }, { t: texLeft, a: Math.PI / 2 }
    ].map(c => {
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(12, 3), new THREE.MeshBasicMaterial({map: c.t, transparent: true, opacity: 0, side: THREE.FrontSide}));
      scene.add(mesh);
      return { mesh, angle: c.a };
    });

    let isDragging = false, rotY = 0;
    window.addEventListener('pointerdown', () => isDragging = true);
    window.addEventListener('pointerup', () => isDragging = false);
    window.addEventListener('pointermove', (e) => { if(isDragging) rotY += e.movementX * 0.01; });

    function animate() {
      requestAnimationFrame(animate);
      
      // DÖNÜŞ YÖNÜ DEĞİŞTİ: Sağdan sola (+) yönde dönüyor
      if(!isDragging) rotY += 0.003; 
      
      heartGroup.rotation.y = rotY;
      stars.rotation.y += 0.0005;

      let normalizedRot = (rotY % (Math.PI * 2));
      if(normalizedRot < 0) normalizedRot += Math.PI * 2;

      cards.forEach(c => {
        let target = (-c.angle) % (Math.PI * 2);
        if(target < 0) target += Math.PI * 2;
        
        const diff = Math.abs(normalizedRot - target);
        const minDiff = Math.min(diff, Math.PI * 2 - diff);
        const maxAngle = Math.PI / 5;
        
        c.mesh.material.opacity = minDiff < maxAngle ? Math.pow(1 - (minDiff/maxAngle), 2) : 0;
        c.mesh.position.set(Math.sin(-c.angle - rotY) * 15, 0, Math.cos(-c.angle - rotY) * 15);
        c.mesh.rotation.copy(camera.rotation);
      });
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
